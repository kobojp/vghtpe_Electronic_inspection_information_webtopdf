name: Build and Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-release:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CI: "true"
      PIPENV_VENV_IN_PROJECT: "1"
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v[0-9]+\.[0-9]+\.[0-9]+$') {
            throw "Release tag must use vMAJOR.MINOR.PATCH"
          }

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install and validate React UI
        run: |
          npm.cmd ci --prefix frontend
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd --prefix frontend test
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd --prefix frontend run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13.3"
          cache: pip
          cache-dependency-path: Pipfile.lock

      - name: Install locked Python dependencies
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install pipenv
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pipenv verify
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          pipenv sync --dev
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Run Python core and API tests
        run: |
          pipenv run python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify browser UI workflows
        working-directory: frontend
        run: |
          npx.cmd playwright install chromium
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm.cmd run test:e2e
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build Windows executable
        run: |
          pipenv run pyinstaller build.spec --clean --noconfirm
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Verify packaged API and frontend assets
        timeout-minutes: 2
        env:
          VGHTPE_STATE_DIR: ${{ github.workspace }}/.cache/packaged-smoke
        run: |
          $exe = (Resolve-Path -LiteralPath "dist\水電消防報表下載系統.exe").Path
          Copy-Item -LiteralPath "data.json" -Destination "dist\data.json"
          $smokeProcess = Start-Process -FilePath $exe -ArgumentList "--headless", "--smoke-test" -WindowStyle Hidden -Wait -PassThru
          if ($smokeProcess.ExitCode -ne 0) {
            throw "Packaged smoke test failed with exit code $($smokeProcess.ExitCode)"
          }

      - name: Package release archive
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $exe = "dist\水電消防報表下載系統.exe"
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "Build output not found: $exe"
          }
          if (-not (Test-Path -LiteralPath "data.json")) {
            throw "External data.json is missing"
          }

          $packageName = "水電消防報表下載系統-$($env:RELEASE_TAG)"
          $packageDirectory = Join-Path "dist" $packageName
          $archive = Join-Path "dist" "$packageName.zip"
          New-Item -ItemType Directory -Path $packageDirectory -Force | Out-Null
          Copy-Item -LiteralPath $exe -Destination $packageDirectory
          Copy-Item -LiteralPath "data.json" -Destination $packageDirectory
          Compress-Archive -Path "$packageDirectory\*" -DestinationPath $archive -Force

          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $zip = [System.IO.Compression.ZipFile]::OpenRead((Resolve-Path -LiteralPath $archive).Path)
          try {
            $entries = @($zip.Entries.FullName)
            if ($entries.Count -ne 2 -or $entries -notcontains "水電消防報表下載系統.exe" -or $entries -notcontains "data.json") {
              throw "Release ZIP must contain only the executable and external data.json"
            }
          }
          finally {
            $zip.Dispose()
          }

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $archive = Join-Path "dist" "水電消防報表下載系統-$($env:RELEASE_TAG).zip"
          gh release create $env:RELEASE_TAG $archive --verify-tag --generate-notes --title "水電消防報表下載系統 $($env:RELEASE_TAG)"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Preserve failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: release-diagnostics
          if-no-files-found: ignore
          retention-days: 7
          include-hidden-files: true
          path: |
            frontend/test-results/
            .cache/packaged-smoke/logs/
            build/build/warn-build.txt
